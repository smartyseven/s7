<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurar Datos — Escuela México</title>
<style>
body{font-family:Arial,sans-serif;padding:30px;background:#f5f5f5;text-align:center}
h2{color:#1B5E20}
.box{background:#fff;border-radius:8px;padding:30px;max-width:500px;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{background:#1B5E20;color:#fff;border:none;padding:14px 28px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:16px;display:inline-block}
#msg{margin-top:20px;font-size:14px;color:#555;line-height:1.6}
#zona{border:2px dashed #ccc;border-radius:8px;padding:30px;margin-top:20px;cursor:pointer;color:#888;font-size:14px}
#zona:hover{border-color:#1B5E20;color:#1B5E20}
</style>
</head>
<body>
<div class="box">
  <h2>Restaurar Datos</h2>
  <p style="font-size:13px;color:#555">Selecciona el archivo de respaldo <b>.json</b> para restaurar los datos en este computador.</p>
  <div id="zona" onclick="document.getElementById('inp').click()">
    Haz clic aquí y selecciona el archivo<br><b>respaldo_escuela_....json</b>
  </div>
  <input type="file" id="inp" accept=".json" style="display:none" onchange="cargar(this)">
  <div id="msg"></div>
</div>
<script>
function cargar(input){
  var file=input.files[0]; if(!file)return;
  var msg=document.getElementById('msg');
  msg.innerHTML='Leyendo archivo...';
  var r=new FileReader();
  r.onload=function(e){
    try{
      var datos=JSON.parse(e.target.result);
      if(!datos.alumnos){msg.innerHTML='<b style="color:red">Error: el archivo no tiene datos de alumnos.</b>';return;}
      var total=Object.keys(datos.alumnos).length;
      var conNotas=Object.values(datos.alumnos).filter(function(a){return a.notas&&Object.keys(a.notas).length>0;}).length;
      var fecha=datos._ts?new Date(datos._ts).toLocaleString('es-CL'):'desconocida';
      if(!confirm('Restaurar este respaldo?\n\nFecha: '+fecha+'\nAlumnos: '+total+'\nCon notas: '+conNotas+'\n\nEsto reemplazara los datos actuales.')){msg.innerHTML='Cancelado.';return;}
      datos._ts=Date.now();
      localStorage.setItem('escuela_mexico_db',JSON.stringify(datos));
      msg.innerHTML='<b style="color:green">Datos restaurados: '+total+' alumnos ('+conNotas+' con notas).</b><br><br><a href="sistema.html" style="background:#1B5E20;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:10px">Ir al sistema ahora</a>';
    }catch(ex){msg.innerHTML='<b style="color:red">Error: '+ex.message+'</b>';}
  };
  r.readAsText(file);
  input.value='';
}
</script>
</body>
</html>
